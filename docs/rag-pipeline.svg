  <rect class="card" x="356" y="606" width="194" height="150" fill="#e7f8ec"/>
  <g transform="translate(425 629)" class="icon"><circle cx="35" cy="31" r="25"/><path d="m53 49 17 17M25 31h20M35 21v20"/><circle cx="35" cy="31" r="5" fill="#69c993" stroke="none"/></g>
