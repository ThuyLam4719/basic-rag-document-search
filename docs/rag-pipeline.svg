  <g transform="translate(684 626)" class="icon"><circle cx="30" cy="30" r="7" fill="#57bd87" stroke="none"/><circle cx="7" cy="10" r="4"/><circle cx="62" cy="12" r="4"/><circle cx="65" cy="52" r="4"/><circle cx="9" cy="54" r="4"/><path d="m11 13 14 13m9-3 23-12M36 34l25 16M24 35 12 51"/><path d="m24 26 6 4-7 2M52 10l5 5-7 1M57 47l3 6-7-1" stroke="#57bd87"/></g>
  <text x="721" y="718" text-anchor="middle" class="label">Tìm gần nhất</text>
