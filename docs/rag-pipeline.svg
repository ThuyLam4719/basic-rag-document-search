<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">RAG pipeline · basic-rag-demo</title>
  <desc id="desc">Pipeline nạp PDF một lần vào Chroma, rồi truy xuất năm đoạn liên quan để Ollama tạo câu trả lời.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f7ff"/><stop offset="1" stop-color="#edfaff"/></linearGradient>
    <linearGradient id="index" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1dc"/><stop offset="1" stop-color="#ffe3dc"/></linearGradient>
    <linearGradient id="chunk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f8ff"/><stop offset="1" stop-color="#d9ecff"/></linearGradient>
    <linearGradient id="vector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7f8ec"/><stop offset="1" stop-color="#c9f0df"/></linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e8ff"/><stop offset="1" stop-color="#e3dbff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#3d4d70" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#8290ae"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.title{font-size:38px;font-weight:750;fill:#222c4a}.subtitle{font-size:16px;fill:#75809a}.lane{font-size:14px;font-weight:800;letter-spacing:1.8px;fill:#7b86a0}.label{font-size:18px;font-weight:750;fill:#293550}.tech{font-size:13px;font-weight:600;fill:#75809a}.tag{font-size:12px;font-weight:800;letter-spacing:.5px;fill:#53617d}.note{font-size:14px;font-weight:650;fill:#576582}.card{stroke:#fff;stroke-width:2;rx:22;filter:url(#shadow)}.arrow{stroke:#8290ae;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:#35415f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="920" fill="url(#page)"/>
  <circle cx="1360" cy="98" r="84" fill="#ffe9d8" opacity=".7"/><circle cx="1295" cy="58" r="22" fill="#cdefff" opacity=".9"/><circle cx="88" cy="835" r="42" fill="#e6dcff" opacity=".8"/>
  <text x="76" y="78" class="title">RAG, từ tài liệu đến câu trả lời</text>
  <text x="78" y="108" class="subtitle">basic-rag-demo · Ollama + Chroma</text>

